{% if request.resolver_match.url_name != 'ai_chat' %}
<!-- Floating Zen AI Companion Widget -->
<style>
    .floating-zen-ai-trigger {
        position: fixed;
        bottom: 24px;
        right: 24px;
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: #ffffff;
        border: none;
        border-radius: 50px;
        padding: 0.7rem 1.25rem;
        display: flex;
        align-items: center;
        gap: 0.6rem;
        font-weight: 600;
        font-size: 0.9rem;
        box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        cursor: pointer;
        z-index: 1060;
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .floating-zen-ai-trigger:hover {
        transform: translateY(-3px) scale(1.03);
        box-shadow: 0 12px 30px rgba(102, 126, 234, 0.55);
        color: #ffffff;
    }
    .floating-zen-ai-trigger .ai-icon-pulse {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #10b981;
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
        animation: floatingPulse 2s infinite;
    }
    @keyframes floatingPulse {
        0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
        70% { box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
        100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    .floating-ai-drawer {
        position: fixed;
        bottom: 85px;
        right: 24px;
        width: 410px;
        height: 600px;
        max-width: calc(100vw - 32px);
        max-height: calc(100vh - 110px);
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 24px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
        display: none;
        flex-direction: column;
        z-index: 1060;
        overflow: hidden;
        animation: slideUpAi 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes slideUpAi {
        from { opacity: 0; transform: translateY(25px) scale(0.96); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .floating-ai-drawer.is-open {
        display: flex;
    }

    .floating-ai-header {
        padding: 0.9rem 1.25rem;
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-shrink: 0;
    }
    .floating-ai-header h6 {
        margin: 0;
        font-weight: 700;
        font-size: 0.95rem;
    }
    .floating-ai-iframe {
        flex: 1;
        width: 100%;
        height: 100%;
        border: none;
    }
</style>

<button class="floating-zen-ai-trigger" id="floatingAiBtn" onclick="toggleFloatingAi()" title="Chat with Zen AI Assistant">
    <i class="bi bi-robot fs-5"></i>
    <span>Ask Zen AI</span>
    <span class="ai-icon-pulse"></span>
</button>

<div class="floating-ai-drawer" id="floatingAiDrawer">
    <div class="floating-ai-header">
        <div class="d-flex align-items-center gap-2">
            <i class="bi bi-robot fs-5"></i>
            <div>
                <h6>Zen AI Companion</h6>
                <small class="text-white-50" style="font-size: 0.68rem;">Mood, Finance & Mindfulness</small>
            </div>
        </div>
        <div class="d-flex align-items-center gap-1">
            <a href="{% url 'community:ai_chat' %}" class="btn btn-sm btn-link text-white text-decoration-none" title="Open Fullscreen Page" style="font-size: 0.85rem;">
                <i class="bi bi-arrows-angle-expand"></i>
            </a>
            <button class="btn btn-sm btn-link text-white" onclick="toggleFloatingAi()" title="Minimize" style="font-size: 1.1rem; padding: 0 0.4rem;">
                <i class="bi bi-x-lg"></i>
            </button>
        </div>
    </div>
    <iframe 
        src="about:blank"
        data-src="https://zen-ai-34.lovable.app"
        class="floating-ai-iframe" 
        id="floatingAiIframe"
        allow="microphone; camera; clipboard-write; autoplay"
        sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-modals allow-downloads allow-popups-to-escape-sandbox">
    </iframe>
</div>

<script>
    function toggleFloatingAi() {
        const drawer = document.getElementById('floatingAiDrawer');
        const iframe = document.getElementById('floatingAiIframe');
        
        drawer.classList.toggle('is-open');
        
        if (drawer.classList.contains('is-open')) {
            // Lazy load the iframe only when opened
            if (iframe.src === 'about:blank') {
                iframe.src = iframe.getAttribute('data-src');
            }
        }
    }
</script>
{% endif %}
