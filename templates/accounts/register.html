{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Zenalyze</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Inter', sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 20px;
        }
        
        .register-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(10px);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000; padding: 20px;
        }
        
        .register-card {
            background: white;
            border-radius: 24px;
            padding: 35px 30px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.3);
            max-width: 480px;
            width: 100%;
            max-height: 92vh;
            overflow-y: auto;
            animation: slideUp 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            position: relative;
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        
        .register-card::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, #667eea, #764ba2, #f093fb);
            border-radius: 24px 24px 0 0;
        }
        
        .logo { font-size: 1.6rem; font-weight: 800; color: #667eea; text-align: center; display: block; margin-bottom: 15px; text-decoration: none; }
        .logo i { margin-right: 8px; }
        
        .form-label { font-weight: 600; color: #1e293b; font-size: 0.82rem; margin-bottom: 5px; }
        .form-control { padding: 10px 14px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 0.9rem; transition: all 0.3s; width: 100%; }
        .form-control:focus { border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,0.1); outline: none; }
        
        .btn-register { 
            background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; 
            padding: 13px; border-radius: 12px; font-weight: 600; font-size: 0.95rem; 
            cursor: pointer; width: 100%; transition: all 0.3s; margin-top: 10px;
        }
        .btn-register:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(102,126,234,0.35); color: white; }

        .btn-google {
            background: #fff; color: #333; border: 2px solid #e2e8f0;
            padding: 11px 16px; border-radius: 12px; font-weight: 500; font-size: 0.9rem;
            cursor: pointer; width: 100%; transition: all 0.3s;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            margin-top: 12px;
        }
        .btn-google:hover { border-color: #DB4437; background: #fef2f2; }
        .btn-google:disabled { opacity: 0.7; cursor: not-allowed; }

        .divider { display: flex; align-items: center; margin: 18px 0 4px; color: #94a3b8; font-size: 0.8rem; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #e2e8f0; }
        .divider span { padding: 0 12px; }

        
        .footer-links { text-align: center; margin-top: 18px; font-size: 0.85rem; color: #64748b; }
        .footer-links a { color: #667eea; text-decoration: none; font-weight: 600; }
        .footer-links a:hover { text-decoration: underline; }
        
        .close-btn { position: absolute; top: 16px; right: 16px; background: none; border: none; font-size: 1.4rem; color: #94a3b8; cursor: pointer; text-decoration: none; }
        .close-btn:hover { color: #333; }
        
        .password-container { position: relative; }
        .password-toggle { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 1.1rem; }
    </style>
</head>
<body>
    <div class="register-overlay">
        <div class="register-card">
            <a href="{% url 'core:home' %}" class="close-btn" title="Back to Home"><i class="bi bi-x-lg"></i></a>
            
            <a href="{% url 'core:home' %}" class="logo">
                <i class="bi bi-heart-pulse-fill"></i>Zenalyze
            </a>
            
            <h4 class="text-center fw-bold mb-1" style="color: #1e293b;">Create Your Account</h4>
            <p class="text-center text-muted small mb-3">Begin your peaceful mental wellness journey</p>
            
            {% if errors %}
            <div class="alert alert-danger py-2 small mb-3">
                <ul class="mb-0 ps-3">
                    {% for err in errors %}
                    <li>{{ err }}</li>
                    {% endfor %}
                </ul>
            </div>
            {% endif %}
            
            <form method="POST" action="{% url 'accounts:register' %}">
                {% csrf_token %}
                <div class="mb-2">
                    <label class="form-label" for="full_name">Full Name</label>
                    <input type="text" class="form-control" id="full_name" name="full_name" value="{{ form_data.full_name|default:'' }}" placeholder="e.g. Sarah Jenkins" required>
                </div>

                <div class="row g-2 mb-2">
                    <div class="col-6">
                        <label class="form-label" for="username">Username</label>
                        <input type="text" class="form-control" id="username" name="username" value="{{ form_data.username|default:'' }}" placeholder="e.g. sarah_j" required>
                    </div>
                    <div class="col-6">
                        <label class="form-label" for="email">Email Address</label>
                        <input type="email" class="form-control" id="email" name="email" value="{{ form_data.email|default:'' }}" placeholder="e.g. sarah@gmail.com" required>
                    </div>
                </div>
                
                <div class="row g-2 mb-2">
                    <div class="col-6">
                        <label class="form-label" for="password">Password</label>
                        <div class="password-container">
                            <input type="password" class="form-control" id="password" name="password" placeholder="Min 6 chars" required minlength="6">
                            <button type="button" class="password-toggle" onclick="togglePassword('password', this)">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>
                    <div class="col-6">
                        <label class="form-label" for="confirm_password">Confirm</label>
                        <div class="password-container">
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Re-enter" required minlength="6">
                            <button type="button" class="password-toggle" onclick="togglePassword('confirm_password', this)">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>
                </div>
                
                <div class="form-check mb-3 mt-3">
                    <input class="form-check-input" type="checkbox" id="agree_terms" name="agree_terms" required checked>
                    <label class="form-check-label small text-muted" for="agree_terms" style="font-size: 0.78rem;">
                        I agree to the <a href="{% url 'core:terms' %}" target="_blank">Terms of Service</a> & <a href="{% url 'core:privacy' %}" target="_blank">Privacy Policy</a>.
                    </label>
                </div>
                
                <button type="submit" class="btn-register">Create Free Account</button>
            </form>

            <div class="divider"><span>or</span></div>

            <button id="btn-google-signup" class="btn-google" type="button" onclick="signUpWithGoogle()">
                <svg width="18" height="18" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                    <path fill="none" d="M0 0h48v48H0z"/>
                </svg>
                <span id="google-signup-text">Sign up with Google</span>
                <span id="google-signup-spinner" style="display:none; width:16px; height:16px; border:2px solid #e2e8f0; border-top-color:#667eea; border-radius:50%; animation:spin 0.7s linear infinite;"></span>
            </button>

            <div class="footer-links">
                Already have an account? <a href="{% url 'accounts:login' %}">Sign In</a>
            </div>
        </div>
    </div>


    <script>
        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'bi bi-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'bi bi-eye';
            }
        }
    </script>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
        import { getAuth, GoogleAuthProvider, signInWithPopup } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

        // TODO: Replace with your Firebase project config
        // Firebase Console → Project Settings → General → Your apps → Web app
         const firebaseConfig = {
            apiKey: "AIzaSyDwdpQKLtsANsZhPVoqXZ2rjF4tghp-NpQ",
            authDomain: "zenalyze-b2f49.firebaseapp.com",
            projectId: "zenalyze-b2f49",
            storageBucket: "zenalyze-b2f49.firebasestorage.app",
            messagingSenderId: "697872155323",
            appId: "1:697872155323:web:64ee5d53884b337b039f9e"
        };

        const app      = initializeApp(firebaseConfig);
        const auth     = getAuth(app);
        const provider = new GoogleAuthProvider();
        provider.addScope('email');
        provider.addScope('profile');

        window.signUpWithGoogle = async function() {
            const btn     = document.getElementById('btn-google-signup');
            const label   = document.getElementById('google-signup-text');
            const spinner = document.getElementById('google-signup-spinner');

            btn.disabled = true;
            label.textContent = 'Connecting...';
            spinner.style.display = 'inline-block';

            try {
                const result  = await signInWithPopup(auth, provider);
                const idToken = await result.user.getIdToken();

                label.textContent = 'Creating account...';

                const response = await fetch('/auth/google/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id_token: idToken }),
                });

                const data = await response.json();

                if (data.status === 'ok') {
                    label.textContent = data.created ? 'Account created! Redirecting...' : 'Welcome back! Redirecting...';
                    window.location.href = data.redirect || '/dashboard/';
                } else {
                    throw new Error(data.message || 'Registration failed');
                }

            } catch (err) {
                btn.disabled = false;
                label.textContent = 'Sign up with Google';
                spinner.style.display = 'none';

                if (err.code !== 'auth/popup-closed-by-user' && err.code !== 'auth/cancelled-popup-request') {
                    const alertEl = document.createElement('div');
                    alertEl.className = 'alert alert-danger py-2 small mt-2';
                    alertEl.innerHTML = `<i class="bi bi-exclamation-circle me-1"></i>${err.message}`;
                    document.getElementById('btn-google-signup').after(alertEl);
                    setTimeout(() => alertEl.remove(), 5000);
                }
            }
        };
    </script>

    <style>
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</body>
</html>
